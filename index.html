<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth & Realtime Database</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        button {
            padding: 10px 15px;
            margin: 5px 0;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button#logout-btn { background-color: #dc3545; }
        button#logout-btn:hover { background-color: #c82333; }
        
        input[type="text"] {
            padding: 10px;
            width: calc(100% - 150px);
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        form { display: flex; margin-bottom: 20px; }

        /* Панель сортировки */
        .sort-panel {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }
        .sort-btn {
            background-color: #6c757d;
            font-size: 14px;
            padding: 8px 12px;
        }
        .sort-btn:hover { background-color: #5a6268; }
        .sort-btn.active { background-color: #28a745; }
        .sort-btn.active:hover { background-color: #218838; }

        /* Список сообщений */
        ul { list-style-type: none; padding: 0; }
        
        li {
            background: white;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between; /* Распределяет элементы по краям */
        }

        /* Две колонки: текст и время */
        .msg-text-col {
            flex-grow: 1; /* Текст занимает всё свободное место */
            word-break: break-word;
            font-size: 16px;
            padding-right: 20px; /* Отступ от времени */
        }
        
        .msg-time-col {
            font-size: 13px;
            color: #777; /* Серый цвет */
            white-space: nowrap;
            margin-right: 15px; /* Отступ от кнопки удаления */
        }

        /* Стили для кнопки удаления */
        .delete-btn {
            background-color: transparent;
            color: #dc3545;
            padding: 5px 10px;
            margin: 0;
            font-size: 14px;
            border: 1px solid #dc3545;
            flex-shrink: 0; /* Запрещаем кнопке сжиматься */
        }
        .delete-btn:hover {
            background-color: #dc3545;
            color: white;
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Секция авторизации -->
    <div id="auth-section">
        <h2>Вход в систему</h2>
        <button id="google-login-btn">Войти через Google</button>
        <button id="github-login-btn">Войти через GitHub</button>
    </div>

    <!-- Секция приложения (после входа) -->
    <div id="app-section" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 id="user-info"></h3>
            <button id="logout-btn">Выйти</button>
        </div>
        
        <hr>

        <form id="data-form">
            <input type="text" id="data-input" placeholder="Введите сообщение..." required>
            <button type="submit">Отправить</button>
        </form>

        <h3>Ваши сообщения:</h3>
        
        <!-- Панель кнопок сортировки -->
        <div class="sort-panel">
            <span>Сортировать по:</span>
            <button id="sort-time-btn" class="sort-btn active" data-type="time">Времени ↓</button>
            <button id="sort-text-btn" class="sort-btn" data-type="text">Тексту (А-Я)</button>
        </div>

        <ul id="messages-list">
            <!-- Сюда будут добавляться сообщения -->
        </ul>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>

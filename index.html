<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Auth & Realtime Database</title>
</head>
<body>
    <div id="auth-section">
        <button id="google-login-btn">Войти через Google</button>
        <button id="github-login-btn">Войти через GitHub</button>
    </div>

    <div id="app-section" style="display:none">
        <button id="logout-btn">Выйти</button>
        <div id="user-info"></div>
        
        <form id="data-form" style="margin-top: 20px;">
            <input type="text" id="data-input" placeholder="Введите сообщение" required>
            <button type="submit">Отправить в базу данных</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { 
            getAuth, 
            signInWithPopup, 
            signInWithRedirect, 
            getRedirectResult, 
            onAuthStateChanged, 
            signOut, 
            GithubAuthProvider,
            GoogleAuthProvider 
        } from "https://gstatic.com";
        import { 
            getDatabase, 
            ref, 
            push, 
            set 
        } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyCiDGylKc7i_f8TVB6wlz-cM24D0GkU9gQ",
            authDomain: "://firebaseapp.com",
            projectId: "owo-0451",
            storageBucket: "owo-0451.firebasestorage.app",
            messagingSenderId: "802512711321",
            appId: "1:802512711321:web:6b329262f4fdb7c81e1208",
            databaseURL: "https://firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        
        const githubProvider = new GithubAuthProvider();
        githubProvider.addScope("read:user");
        const googleProvider = new GoogleAuthProvider();

        const githubLoginBtn = document.getElementById("github-login-btn");
        const googleLoginBtn = document.getElementById("google-login-btn");
        const logoutBtn = document.getElementById("logout-btn");
        const userInfo = document.getElementById("user-info");
        const authSection = document.getElementById("auth-section");
        const appSection = document.getElementById("app-section");
        const dataForm = document.getElementById("data-form");
        const dataInput = document.getElementById("data-input");

        let currentUser = null;

        async function login(provider) {
            try {
                const result = await signInWithPopup(auth, provider);
                console.log("Успех:", result.user);
            } catch (error) {
                if (
                    error.code === "auth/popup-blocked" ||
                    error.code === "auth/popup-closed-by-user" ||
                    error.code === "auth/cancelled-popup-request" ||
                    error.code === "auth/operation-not-supported-in-this-environment"
                ) {
                    console.warn("Popup не сработал, переключаюсь на redirect:", error.code);
                    await signInWithRedirect(auth, provider);
                    return;
                }
                console.error("Ошибка авторизации:", error.code, error.message, error);
                alert(`Ошибка [${error.code}]: ${error.message}`);
            }
        }

        getRedirectResult(auth)
            .then((result) => {
                if (result?.user) console.log("Вход через redirect:", result.user);
            })
            .catch((error) => {
                console.error("Redirect error:", error.code, error.message);
            });

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                authSection.style.display = "none";
                appSection.style.display = "block";
                userInfo.textContent = `Вы вошли как ${user.displayName || user.email || user.uid}`;
            } else {
                authSection.style.display = "block";
                appSection.style.display = "none";
                userInfo.textContent = "";
            }
        });

        logoutBtn?.addEventListener("click", async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Ошибка выхода:", error);
            }
        });

        dataForm?.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const textValue = dataInput.value.trim();
            if (!textValue) return;

            try {
                const userMessagesRef = ref(database, 'messages/' + currentUser.uid);
                const newMessageRef = push(userMessagesRef);
                await set(newMessageRef, {
                    text: textValue,
                    timestamp: Date.now()
                });
                dataInput.value = "";
                alert("Данные успешно отправлены!");
            } catch (error) {
                console.error("Ошибка записи в БД:", error);
                alert(`Ошибка отправки: ${error.message}`);
            }
        });

        githubLoginBtn?.addEventListener("click", () => login(githubProvider));
        googleLoginBtn?.addEventListener("click", () => login(googleProvider));
    </script>
</body>
</html>

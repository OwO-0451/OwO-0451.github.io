<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Заметки — Модульная версия</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="error-banner" class="error-banner hidden" role="alert">
        <span id="error-text"></span>
        <button type="button" id="error-close">×</button>
    </div>

    <section id="auth-section">
        <h2>Вход в систему</h2>
        <button type="button" id="google-login-btn">Войти через Google</button>
        <button type="button" id="github-login-btn">Войти через GitHub</button>
    </section>

    <section id="app-section" class="hidden">
        <div class="app-header">
            <div class="user-info">
                <img id="user-avatar" class="avatar hidden" alt="">
                <h3 id="user-info"></h3>
            </div>
            <div class="header-actions">
                <button type="button" id="logout-btn">Выйти</button>
            </div>
        </div>

        <hr>

        <form id="data-form">
            <input type="text" id="data-input" placeholder="Введите сообщение..." maxlength="500" autocomplete="off" required>
            <button type="submit" id="submit-btn">Отправить</button>
        </form>

        <h3>Ваши сообщения <span id="messages-count" class="count"></span></h3>
        
        <div class="sort-panel">
            <span>Сортировать по:</span>
            <button type="button" id="sort-time-btn" class="sort-btn active" aria-pressed="true">Времени ↓</button>
            <button type="button" id="sort-text-btn" class="sort-btn" aria-pressed="false">Тексту (А-Я)</button>
        </div>

        <ul id="messages-list"></ul>
    </section>

    <script type="module" src="main.js"></script>
</body>
</html>

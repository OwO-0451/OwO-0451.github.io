<button id="github-login-btn">Войти через GitHub</button>

<script type="module">
  import { initializeApp } from "https://gstatic.com";
  import { 
    getAuth, 
    signInWithPopup, 
    GithubAuthProvider 
  } from "https://gstatic.com";

  const firebaseConfig = {
    apiKey: "AIzaSyCiDGylKc7i_f8TVB6wlz-cM24D0GkU9gQ",
    authDomain: "://firebaseapp.com",
    projectId: "owo-0451",
    storageBucket: "owo-0451.firebasestorage.app",
    messagingSenderId: "802512711321",
    appId: "1:802512711321:web:6b329262f4fdb7c81e1208"
  };

  console.log("1. Инициализация Firebase...");
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GithubAuthProvider();
  console.log("2. Firebase Auth готов.");

  async function loginWithGitHub() {
    console.log("3. Клик зафиксирован. Попытка открыть Popup...");
    try {
      const result = await signInWithPopup(auth, provider);
      console.log("Успех! Данные пользователя:", result.user);
      alert(`Добро пожаловать, ${result.user.displayName}!`);
    } catch (error) {
      console.error("Критическая ошибка авторизации:");
      console.error("Код ошибки (code):", error.code);
      console.error("Сообщение (message):", error.message);
      console.error("Полный объект ошибки:", error);
      
      alert(`Ошибка [${error.code}]: ${error.message}`);
    }
  }

  const btn = document.getElementById('github-login-btn');
  if (btn) {
    btn.addEventListener('click', loginWithGitHub);
    console.log("4. Обработчик клика успешно привязан к кнопке.");
  } else {
    console.error("Критическая ошибка: Кнопка 'github-login-btn' отсутствует в DOM дереве!");
  }
</script>

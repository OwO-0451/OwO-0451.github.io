<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Auth (GitHub & Google)</title>
</head>
<body>
    <button id="google-login-btn">Войти через Google</button>
    <button id="github-login-btn">Войти через GitHub</button>
    <button id="logout-btn" style="display:none">Выйти</button>
    <div id="user-info"></div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { 
            getAuth, 
            signInWithPopup, 
            signInWithRedirect, 
            getRedirectResult, 
            onAuthStateChanged, 
            signOut, 
            GithubAuthProvider,
            GoogleAuthProvider 
        } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyCiDGylKc7i_f8TVB6wlz-cM24D0GkU9gQ",
            authDomain: "://firebaseapp.com",
            projectId: "owo-0451",
            storageBucket: "owo-0451.firebasestorage.app",
            messagingSenderId: "802512711321",
            appId: "1:802512711321:web:6b329262f4fdb7c81e1208"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        const githubProvider = new GithubAuthProvider();
        githubProvider.addScope("read:user");

        const googleProvider = new GoogleAuthProvider();

        const githubLoginBtn = document.getElementById("github-login-btn");
        const googleLoginBtn = document.getElementById("google-login-btn");
        const logoutBtn = document.getElementById("logout-btn");
        const userInfo = document.getElementById("user-info");

        async function login(provider) {
            try {
                const result = await signInWithPopup(auth, provider);
                console.log("Успех:", result.user);
            } catch (error) {
                if (
                    error.code === "auth/popup-blocked" ||
                    error.code === "auth/popup-closed-by-user" ||
                    error.code === "auth/cancelled-popup-request" ||
                    error.code === "auth/operation-not-supported-in-this-environment"
                ) {
                    console.warn("Popup не сработал, переключаюсь на redirect:", error.code);
                    await signInWithRedirect(auth, provider);
                    return;
                }
                console.error("Ошибка авторизации:", error.code, error.message, error);
                alert(`Ошибка [${error.code}]: ${error.message}`);
            }
        }

        getRedirectResult(auth)
            .then((result) => {
                if (result?.user) console.log("Вход через redirect:", result.user);
            })
            .catch((error) => {
                console.error("Redirect error:", error.code, error.message);
            });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                githubLoginBtn.style.display = "none";
                googleLoginBtn.style.display = "none";
                logoutBtn.style.display = "inline-block";
                userInfo.textContent = `Вы вошли как ${user.displayName || user.email || user.uid}`;
            } else {
                githubLoginBtn.style.display = "inline-block";
                googleLoginBtn.style.display = "inline-block";
                logoutBtn.style.display = "none";
                userInfo.textContent = "";
            }
        });

        logoutBtn?.addEventListener("click", async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Ошибка выхода:", error);
            }
        });

        githubLoginBtn?.addEventListener("click", () => login(githubProvider));
        googleLoginBtn?.addEventListener("click", () => login(googleProvider));
    </script>
</body>
</html>
